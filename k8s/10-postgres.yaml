# PostgreSQL, in-cluster, on an EBS volume via the CSI driver.
#
# On EKS the volume is a real EBS disk with its own lifecycle, independent of any
# node: if a node is replaced, the volume detaches and re-attaches to the
# replacement. That is a genuine improvement over the single-node k3s setup,
# where the data lived on the instance's own disk and an instance replacement
# lost it.
#
# Two constraints follow from EBS and both are handled here:
#
#   * A volume lives in ONE Availability Zone and attaches only to a node in
#     that zone. The gp3 StorageClass uses WaitForFirstConsumer so the volume is
#     created where the pod actually scheduled.
#   * A gp3 volume attaches to one node at a time (ReadWriteOnce), which suits a
#     single Postgres replica and rules out scaling it out.
#
# The pg_dump CronJob in 40-backup.yaml is still worth keeping: EBS protects
# against node loss, not against a bad migration or an accidental delete.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jobtrail
spec:
  # Headless: the StatefulSet gets a stable DNS name and there is only ever one
  # replica, so there is nothing to load balance.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: jobtrail
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # The postgres image's own uid. Set at pod level so the mounted volume
        # is group-owned correctly on first creation.
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: jobtrail
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jobtrail-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobtrail-secrets
                  key: DB_PASSWORD
            # A mounted volume root can contain lost+found, which initdb
            # refuses to work in. Keeping the cluster in a subdirectory avoids
            # that entirely.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # pg_isready, not a TCP check: Postgres accepts connections during
          # recovery well before it can answer a query.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "jobtrail"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "jobtrail"]
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 8Gi
