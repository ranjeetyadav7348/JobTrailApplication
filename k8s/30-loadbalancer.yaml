# Public entry point.
#
# k3s bundled Traefik, so an Ingress resource was enough. EKS bundles no ingress
# controller at all — an Ingress object there is inert until you install one, and
# it fails silently: the resource is accepted, no address is ever assigned, and
# nothing explains why.
#
# So this uses a Service of type LoadBalancer instead, which the AWS cloud
# controller manager (already running on every EKS cluster) turns into a real
# load balancer with nothing extra to install. See the note at the bottom for
# when to move up to an ALB Ingress.
apiVersion: v1
kind: Service
metadata:
  name: jobtrail-lb
  namespace: jobtrail
  annotations:
    # NLB rather than the default Classic Load Balancer: cheaper, faster, and
    # CLB is legacy on AWS's own roadmap.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Route to pod IPs directly instead of hopping via a node's kube-proxy.
    # One less hop, and it preserves the client source IP.
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # Health check the app's real readiness endpoint, not just an open port. A
    # JVM accepts TCP long before it can serve a request.
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "HTTP"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/actuator/health/readiness"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8080"
spec:
  type: LoadBalancer
  selector:
    app: jobtrail
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  # ─────────────────────────────────────────────────────────────────────────
  # ⚠️ REPLACE THIS BEFORE THE FIRST DEPLOY.
  #
  # The app has no authentication of its own. Anyone who can reach it can read
  # your full application history and send email through your SMTP credentials.
  # This list is what stands between the internet and that, so it must be your
  # own address — find it with `curl -s ifconfig.me`.
  #
  # Left as a placeholder that matches nothing, so a forgotten edit fails closed
  # (you cannot reach it) rather than open (everyone can).
  # ─────────────────────────────────────────────────────────────────────────
  loadBalancerSourceRanges:
    - "192.0.2.1/32" # TEST-NET-1, reserved for documentation — matches nothing real
#
# Moving to an ALB Ingress later:
#
# An ALB gives HTTP path routing, TLS termination with an ACM certificate, and
# optional Cognito/OIDC auth in front of the app — which is the real fix for
# "there is no login". It needs the AWS Load Balancer Controller installed
# (Helm chart plus an IAM policy and a service account), which is why it is not
# the default here. Once installed, replace this Service with an Ingress whose
# ingressClassName is `alb`.
