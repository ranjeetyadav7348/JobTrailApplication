# TEMPLATE ONLY — do not fill this in and commit it.
#
# A Kubernetes Secret is base64, which is encoding, not encryption: anyone with
# the file has the credentials. Committing a filled-in copy would repeat exactly
# the mistake this deployment exists to undo — the previous Gmail app password
# reached GitHub that way and had to be revoked.
#
# Create the real Secret imperatively on the node instead, so the values only
# ever exist in your shell history and in etcd. DEPLOY.md has the commands; they
# are repeated here so this file is self-contained:
#
#   kubectl -n jobtrail create secret generic jobtrail-secrets \
#     --from-literal=DB_USERNAME='postgres' \
#     --from-literal=DB_PASSWORD='<a long random string>' \
#     --from-literal=SMTP_USERNAME='you@gmail.com' \
#     --from-literal=SMTP_PASSWORD='<NEW Gmail app password>' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...'
#
#   # The CV, mounted read-only at /app/resume/resume.pdf
#   kubectl -n jobtrail create secret generic jobtrail-resume \
#     --from-file=resume.pdf=./Ranjeet_Java_AI_4Exp.pdf
#
#   # Lets the node pull the image from GHCR (skip if the package is public)
#   kubectl -n jobtrail create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username='<github username>' \
#     --docker-password='<PAT with read:packages>'
#
# The shape below is what those commands produce, for reference only.
apiVersion: v1
kind: Secret
metadata:
  name: jobtrail-secrets
  namespace: jobtrail
type: Opaque
stringData:
  DB_USERNAME: "postgres"
  DB_PASSWORD: "CHANGE_ME"
  SMTP_USERNAME: "CHANGE_ME"
  # Must be a NEW Gmail app password. The one previously in application.yml is
  # in git history and has to be treated as compromised.
  SMTP_PASSWORD: "CHANGE_ME"
  # Optional. Without it the app still runs; the assistant and the AI triage
  # simply report themselves unavailable.
  ANTHROPIC_API_KEY: ""
  # Only needed if you keep k8s/40-backup.yaml.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
