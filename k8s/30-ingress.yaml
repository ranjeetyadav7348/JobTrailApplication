# k3s bundles Traefik as its ingress controller and creates a LoadBalancer
# service for it via klipper-lb, so on a single EC2 node this exposes the app on
# the instance's ports 80/443 with nothing else to install.
#
# ⚠️ This serves plain HTTP. The app has no authentication of its own — anyone
# who can reach it can read your application history and send email through your
# SMTP credentials. Before pointing a real domain at this, either restrict the
# EC2 security group to your own IP (the simplest and the default in DEPLOY.md),
# or put TLS and an auth layer in front. Do not expose it to 0.0.0.0/0 as-is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobtrail
  namespace: jobtrail
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    # Host-based so a browser reaches it by name. Replace with your own domain,
    # or add an /etc/hosts entry pointing jobtrail.local at the EC2 public IP.
    - host: jobtrail.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobtrail
                port:
                  number: 80
