# EBS-backed storage for the Postgres volume.
#
# EKS ships no default StorageClass that provisions real disks — unlike k3s,
# which bundles local-path. Without this, the Postgres PVC sits Pending for ever
# and the app never starts, with nothing in the app's own logs to explain it.
#
# Requires the aws-ebs-csi-driver addon on the cluster (DEPLOY.md installs it).
#
# gp3 over the older gp2: cheaper per GiB, and its baseline 3000 IOPS is
# independent of volume size, so a small volume is not also a slow one.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
# Retain, not Delete: this volume holds the application history. Deleting the
# PVC — by accident, or by tearing down the namespace — should not silently take
# the data with it. The trade-off is that a genuinely unwanted volume has to be
# removed by hand afterwards, which is the right way round for data you cannot
# reconstruct.
reclaimPolicy: Retain
allowVolumeExpansion: true
# An EBS volume exists in one Availability Zone and can only attach to a node in
# that zone. Binding late means the volume is created in whichever AZ the pod
# actually landed in; binding immediately can strand a volume in an AZ with no
# schedulable node, leaving the pod permanently Pending.
volumeBindingMode: WaitForFirstConsumer
