name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}

# A second push while a deploy is in flight would race the first onto the same
# single-replica Deployment. Queue instead — and never cancel mid-deploy, which
# could leave the rollout half-applied.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # The executable bit is stored in the git index, and a Windows clone with
      # core.filemode=false does not record it — so mvnw can arrive here as 0644
      # and `./mvnw` fails with "Permission denied". The bit is set in the index
      # (100755); this is belt-and-braces against a future commit dropping it.
      - name: Make the Maven wrapper executable
        run: chmod +x ./mvnw

      # Runs on in-memory H2, and the test profile sets
      # spring.ai.model.embedding=none so no model is downloaded. No services,
      # no secrets, no network.
      - name: Run tests
        run: ./mvnw -B test

  build:
    name: Build and push image
    needs: test
    # Never publish an image for a pull request — a PR from a fork would
    # otherwise push a tag into the registry before anyone reviewed the code.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR paths must be lowercase and GitHub owners may contain capitals.
      - name: Compute image reference
        id: meta
        run: |
          REPO="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=${REGISTRY}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # EKS managed node groups here run x86_64. Pinned explicitly so the
          # architecture is a deliberate choice, not a property of whichever
          # runner happened to pick up the job.
          platforms: linux/amd64
          push: true
          # The immutable SHA tag is what gets deployed, so rolling back is just
          # re-running an older commit's deploy. `latest` is a convenience.
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Required for GitHub's OIDC provider to mint the token AWS exchanges for
      # temporary credentials. This is what removes the need for any stored AWS
      # key — nothing long-lived exists to leak or rotate.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-jobtrail-${{ github.run_id }}

      - name: Write kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"
          # Fail here, loudly, if the role cannot reach the API — rather than
          # letting every later kubectl fail one at a time with the same cause.
          kubectl version --output=yaml >/dev/null
          kubectl get nodes

      - name: Apply manifests
        run: |
          set -euo pipefail

          kubectl apply -f k8s/00-namespace.yaml
          # StorageClass is cluster-scoped and must exist before the Postgres
          # PVC is created, or the claim binds to nothing and sits Pending.
          kubectl apply -f k8s/05-storage.yaml
          kubectl apply -f k8s/10-postgres.yaml
          kubectl apply -f k8s/20-app.yaml
          kubectl apply -f k8s/30-loadbalancer.yaml

          # The backup CronJob needs AWS credentials that may not be configured.
          # Apply it only when they are, so an optional extra cannot fail the
          # deploy of the app itself.
          if kubectl -n jobtrail get secret jobtrail-secrets \
               -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' 2>/dev/null | grep -q .; then
            kubectl apply -f k8s/40-backup.yaml
          else
            echo "Skipping backup CronJob: no AWS credentials in jobtrail-secrets."
          fi

      - name: Roll out
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          # Point the Deployment at the image this run just built, replacing the
          # placeholder baked into the manifest.
          kubectl -n jobtrail set image deployment/jobtrail "jobtrail=${IMAGE}"

          # Wait for the pod to actually become ready. Without this the workflow
          # reports success for a container that is crash-looping. On failure,
          # roll back rather than leaving the Deployment wedged part-way — the
          # previous image was known good.
          if ! kubectl -n jobtrail rollout status deployment/jobtrail --timeout=8m; then
            echo "::error::Rollout failed — rolling back to the previous revision."
            kubectl -n jobtrail rollout undo deployment/jobtrail || true
            kubectl -n jobtrail rollout status deployment/jobtrail --timeout=4m || true
            exit 1
          fi

          echo "Deployed ${IMAGE}"

      - name: Summarise
        if: success()
        run: |
          set -euo pipefail
          LB="$(kubectl -n jobtrail get svc jobtrail-lb \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
          {
            echo "### Deployed to EKS"
            echo ""
            echo "- Image: \`${{ needs.build.outputs.image }}\`"
            echo "- Cluster: \`${EKS_CLUSTER}\` (${AWS_REGION})"
            if [ -n "$LB" ]; then
              echo "- URL: http://${LB}"
            else
              echo "- Load balancer still provisioning — this takes a few minutes on first deploy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure detail
        if: failure()
        run: |
          # Best effort: this step exists to explain a failure, so it must never
          # fail itself and mask the original error.
          echo "--- pods ---";       kubectl -n jobtrail get pods -o wide || true
          echo "--- pvc ---";        kubectl -n jobtrail get pvc || true
          echo "--- events ---";     kubectl -n jobtrail get events --sort-by=.lastTimestamp | tail -30 || true
          echo "--- app logs ---";   kubectl -n jobtrail logs deployment/jobtrail --tail=100 --all-containers || true
          echo "--- describe ---";   kubectl -n jobtrail describe deployment/jobtrail || true
