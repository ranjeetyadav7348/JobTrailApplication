# Tests never touch the real ./data directory.
spring.datasource.url=jdbc:h2:mem:jobtrail-test;DB_CLOSE_DELAY=-1
# application.yml pins the Postgres driver, which refuses the H2 URL above and
# leaves Hibernate unable to read any metadata. Override it here too.
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.mail.host=localhost
spring.mail.username=
spring.mail.password=
# The local embedding model is ~90MB and is loaded when its bean is built, so
# leaving it on would make the test suite download a model and need a network.
# Retrieval is built to run without it (lexical arm only), which is exactly the
# degraded path worth exercising here anyway.
spring.ai.model.embedding=none
logging.level.root=WARN
